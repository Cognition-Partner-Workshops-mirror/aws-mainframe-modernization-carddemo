# Balance Transfer Application - Docker Compose
# Services: Oracle XE, Redis, Spring Boot backend, Angular frontend, Apache Superset
# All services share the app-network for inter-container communication.

version: '3.8'

services:
  # Oracle XE database for balance data storage
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=balanceapp
      - APP_USER_PASSWORD=balanceapp
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ../db:/container-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10

  # Redis cache for Spring Boot (DB 0) and Superset (DB 1)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=system
      - SPRING_DATASOURCE_PASSWORD=oracle
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_DATABASE=0
    depends_on:
      oracle-xe:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # Angular frontend served via Nginx
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app-network

  # Apache Superset for reporting and dashboards
  superset:
    image: apache/superset:3.1.0
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=your-secret-key-change-in-production
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/superset_home/superset.db
      # Point Superset to our custom config
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py
    volumes:
      - superset_home:/app/superset_home
      - ./superset/docker-init.sh:/docker-init.sh
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./superset/datasource-config.py:/app/datasource-config.py
      - ./superset/dashboards:/app/dashboards
    depends_on:
      oracle-xe:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/docker-init.sh"]
    networks:
      - app-network

volumes:
  oracle_data:
  redis_data:
  superset_home:

networks:
  app-network:
    driver: bridge
